<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">Textual Silicon</a>
      <nav aria-label="Primary navigation">
        <a href="{{ '/user-guide/' | relative_url }}">User guide</a>
        <a href="{{ '/developer-guide/' | relative_url }}">Developer guide</a>
        <a href="{{ '/faq/' | relative_url }}">FAQ</a>
        <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
        <a href="https://github.com/kubrick06010/Textual_silicon">Repository</a>
      </nav>
    </div>
  </header>

  <main class="wrap content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Textual Silicon is an independent community project. It is not affiliated with, endorsed by, or supported by Codeux Software, LLC.</p>
      <p><a href="https://github.com/kubrick06010/Textual_silicon/issues">Report a problem</a> · Documentation is maintained with the source code.</p>
    </div>
  </footer>
</body>
</html>
